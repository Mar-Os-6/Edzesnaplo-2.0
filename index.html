<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edzésnapló - UI Redesign Mockup</title>
    <style>
        :root {
            --bg-color: #0b0d12;
            --card-bg: rgba(23, 27, 38, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-green: #00e676;
            --accent-green-glow: rgba(0, 230, 118, 0.25);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 230, 118, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
        }

        /* Mobil nézet szimuláció */
        .app-container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            padding: 20px 16px 120px 16px;
            position: relative;
        }

        /* Fejléc */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #a5f3fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .date-badge {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            backdrop-filter: blur(10px);
        }

        /* Glassmorphism kártyák */
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Gyors kitöltés gomb */
        .quick-fill-btn {
            width: 100%;
            background: rgba(0, 230, 118, 0.08);
            border: 1px dashed var(--accent-green);
            color: var(--accent-green);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 14px;
            transition: all 0.2s ease;
        }

        .quick-fill-btn:active {
            transform: scale(0.98);
            background: var(--accent-green-glow);
        }

        /* Form Elemek */
        .form-group {
            margin-bottom: 12px;
        }

        .form-control {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-green);
        }

        /* Sorozatok sora */
        .set-row {
            display: grid;
            grid-template-columns: 35px 1fr 1fr 35px;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }

        .set-num {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
        }

        .btn-main {
            width: 100%;
            background: var(--accent-green);
            color: #000;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 20px var(--accent-green-glow);
            transition: transform 0.15s ease;
        }

        .btn-main:active {
            transform: scale(0.97);
        }

        /* PR Rekord Badge */
        .pr-badge {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.4);
        }

        /* LEBEGŐ PIHENŐIDŐZÍTŐ (Floating Rest Timer) */
        .floating-timer {
            position: fixed;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 398px;
            background: rgba(18, 24, 38, 0.9);
            border: 1px solid var(--accent-green);
            backdrop-filter: blur(16px);
            border-radius: 50px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-green-glow);
            z-index: 99;
        }

        .timer-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-time {
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .timer-controls {
            display: flex;
            gap: 8px;
        }

        .timer-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* BOTTOM NAVIGÁCIÓ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: rgba(11, 13, 18, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.72rem;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-green);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Fejléc -->
        <div class="header">
            <h1>Szia, Krisztián! 💪</h1>
            <div class="date-badge">Ma, Május 12.</div>
        </div>

        <!-- Aktív Gyakorlat Kártya -->
        <div class="glass-card">
            <div class="card-title">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.4 9.6a2 2 0 1 1 3.2 2.4L18 16l-3 3-4-4 3-3 4.4-2.4z"/><path d="M15.6 6.8a2 2 0 1 0-3.2-2.4L9 8 6 5l-4 4 3 3-2.4 4.4a2 2 0 1 0 2.4 3.2L12 16l3 3 4-4-3-3 3.6-5.2z"/></svg>
                Gyakorlat Rögzítése
            </div>

            <div class="form-group">
                <select class="form-control">
                    <option>Mell (Fekvenyomás)</option>
                    <option>Tricepsz (Letolás csigán)</option>
                </select>
            </div>

            <!-- ⚡ UX 2. OPCIÓ: Gyorsszint-betöltő gomb -->
            <div class="quick-fill-btn">
                <span>⚡ Legutóbbi: 85 kg × 8 ismétlés</span>
                <small style="opacity: 0.7">(Kattints a betöltéshez)</small>
            </div>

            <!-- Sorozatok -->
            <div class="set-row">
                <span class="set-num">1.</span>
                <input type="number" class="form-control" value="85" placeholder="kg">
                <input type="number" class="form-control" value="8" placeholder="ism">
                <div class="pr-badge">PR</div>
            </div>

            <div class="set-row">
                <span class="set-num">2.</span>
                <input type="number" class="form-control" placeholder="kg">
                <input type="number" class="form-control" placeholder="ism">
                <span style="color: var(--text-muted); text-align:center;">✕</span>
            </div>

            <button class="btn-main" style="margin-top: 10px;">Sorozat Mentése & Stopper Indítása</button>
        </div>

        <!-- Előzmény Kártya -->
        <div class="glass-card">
            <div class="card-title">Mai Teljesítmény</div>
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem;">
                <div>
                    <strong>Incline Fekvenyomás</strong><br>
                    <small style="color: var(--text-muted);">3 sorozat • Mell</small>
                </div>
                <div style="text-align: right; color: var(--accent-green); font-weight: 700;">
                    75 kg × 10
                </div>
            </div>
        </div>

    </div>

    <!-- ⏱️ UX 2. OPCIÓ: LEBEGŐ PIHENŐIDŐZÍTŐ (Mindig látható) -->
    <div class="floating-timer">
        <div class="timer-info">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00e676" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span class="timer-time">00:48</span>
        </div>
        <div class="timer-controls">
            <button class="timer-btn">+15s</button>
            <button class="timer-btn" style="background: rgba(239, 68, 68, 0.2); color: #f87171;">Stop</button>
        </div>
    </div>

    <!-- 🎨 UI 1. OPCIÓ: MODERN BOTTOM NAVIGÁCIÓ SVG IKONOKKAL -->
    <div class="bottom-nav">
        <a class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M4 10h16M4 14h16"/></svg>
            Edzés
        </a>
        <a class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
            Előzmények
        </a>
        <a class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            Testadatok
        </a>
    </div>

</body>
</html>
